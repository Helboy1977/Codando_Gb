<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Gastos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header>
      <h1>💰 Controle de Gastos</h1>
      <p class="subtitle">Registre e acompanhe seus gastos por categoria</p>
    </header>

    <main>
      <section class="card form-card">
        <h2>Novo gasto</h2>
        <form id="expense-form">
          <div class="field">
            <label for="description">Descrição</label>
            <input type="text" id="description" name="description" placeholder="Ex: Almoço" required />
          </div>
          <div class="field">
            <label for="amount">Valor (R$)</label>
            <input type="number" id="amount" name="amount" min="0.01" step="0.01" placeholder="0,00" required />
          </div>
          <div class="field">
            <label for="category">Categoria</label>
            <select id="category" name="category" required>
              {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label for="date">Data</label>
            <input type="date" id="date" name="date" />
          </div>
          <button type="submit">Adicionar</button>
          <p id="form-error" class="error"></p>
        </form>
      </section>

      <section class="card summary-card">
        <h2>Resumo</h2>
        <p class="total">Total: <span id="total-amount">R$ 0,00</span></p>
        <canvas id="category-chart" width="280" height="280"></canvas>
      </section>

      <section class="card list-card">
        <h2>Gastos registrados</h2>
        <table id="expense-table">
          <thead>
            <tr>
              <th>Data</th>
              <th>Descrição</th>
              <th>Categoria</th>
              <th>Valor</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="expense-tbody"></tbody>
        </table>
        <p id="empty-state" class="empty-state">Nenhum gasto registrado ainda.</p>
      </section>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
